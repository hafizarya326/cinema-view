name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome or install Playwright Chromium fallback
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using runner Chrome: $(google-chrome --version)"
          else
            echo "google-chrome not found; falling back to Playwright bundled Chromium"
            echo "PLAYWRIGHT_USE_BUNDLED_CHROMIUM=1" >> "$GITHUB_ENV"
            npx playwright install --with-deps chromium
          fi

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright E2E tests
        run: npm run e2e

      - name: Upload Playwright HTML report on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
